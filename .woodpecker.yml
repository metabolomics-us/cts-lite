# Woodpecker CI (ci.metabolomics.us) -- the cts-lite gate AND its deploy.
#
# CD: it also replaces the build_and_push_image and deploy_to_ecs jobs of the
# removed GitHub Actions workflow (.github/workflows/cicd.yml, see c68a30f8^):
# steps `build-image` and `deploy`, which run only on a push to main (and on
# manual pipelines), only after both gates passed, and honour the old
# `nobuild` / `nodeploy` commit-message words. See ops/ci/woodpecker-deploy.sh.
# A manual pipeline with the variable DRY_RUN=1 builds, smoke-tests and pushes
# only :ci-dryrun-<sha> -- no :latest, no ECS.
#
# CI: it replaces two TeamCity build configurations:
#
#   backend_CtsLite            "Unit & E2E Tests": clean test cache, build,
#                              test with coverage, publish the coverage
#                              metric, and run the Playwright E2E suite.
#   backend_CtsLiteOtelConfig  "otel-config-validate": otelcol-contrib
#                              validate of telemetry/collector/config.yaml.
#                              The otel-config step also carries GitHub's
#                              otel_compare_configs: config.yaml and
#                              config.json must hold the same config.
#
# TeamCity build FEATURES have no file to live in on Woodpecker, so they map
# as follows:
#
#   pullRequests            -> `when:` pull_request, manual, push to main
#   commit-status-publisher -> native; Woodpecker posts the check itself
#   BuildFailureOnMetric    -> the 75% coverage floor, now enforced inside
#                              ops/ci/woodpecker-gates.sh (it was a GATE,
#                              not a report, and had to keep failing builds)
#   golang (test.format=json) -> dropped with `go test -json`; the flag only
#                              fed TeamCity's test-report parser
#   perfmon                 -> dropped; agent resource graphs, not a gate
#   PROVIDE_AWS_CREDS       -> dropped for the gates; nothing they run touches
#                              AWS. Only build-image/deploy get credentials
#                              (repo secrets deploy_aws_*, push+manual only).
#
# The E2E suite does NOT migrate: it pins Chrome (`channel: 'chrome'`) and
# the exec hosts have no browser and no way to install one. The PR that
# added this file says so, and links the tracking issue.
#
# Exec hosts are Slurm allocations on Rocky 9 nodes, so:
#
#  * `image:` names a HOST executable, not a container image: `bash` runs the
#    job's own shell. There is no docker, no apt and no sudo.
#  * The clone plugin fails invisibly on this backend (no step logs for
#    plugins), so skip_clone + a plain git checkout step, with the forge
#    credential staged at /etc/woodpecker-git-credentials.
#  * The agent reproducibly drops a step's final log chunk, so the gate
#    script prints its journal path FIRST and tees everything to it.
#
# The step logic is in this repo (ops/ci/woodpecker-gates.sh) rather than on
# beegfs with the shared ci-steps, so a check changes in the same commit as
# the code it covers. It takes no Woodpecker-specific input:
# `bash ops/ci/woodpecker-gates.sh` reproduces CI from a clean checkout.
when:
  - event: [pull_request, manual]
  - event: push
    branch: main

skip_clone: true

steps:
  - name: checkout
    image: bash
    commands:
      - 'set -eu'
      - 'test -r /etc/woodpecker-git-credentials || { echo "the job staged no forge credential" >&2; exit 1; }'
      - 'git init -q -b "${CI_COMMIT_BRANCH:-main}" .'
      - 'git remote add origin "https://github.com/${CI_REPO}.git"'
      - 'git fetch --no-tags --depth=1 origin "$CI_COMMIT_SHA"'
      - 'git checkout -q FETCH_HEAD'
      - 'git --no-pager log --oneline -1'

  - name: gates
    image: bash
    commands:
      - 'set -eu'
      - 'bash ops/ci/woodpecker-gates.sh go'

  # Its own step, so a collector-config regression is attributable at a
  # glance instead of being buried in the Go log -- and so it keeps the
  # 1:1 shape of the two TeamCity configurations it replaces.
  - name: otel-config
    image: bash
    commands:
      - 'set -eu'
      - 'bash ops/ci/woodpecker-gates.sh otel'

  # CD. Both steps run after the gates (steps are sequential; a red gate
  # stops the pipeline) and only for a push to main or a manual pipeline.
  # A manual pipeline on any branch but main refuses to deploy unless it is
  # a DRY_RUN=1 dry run.
  - name: build-image
    image: bash
    when:
      - event: push
        branch: main
      - event: manual
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: deploy_aws_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: deploy_aws_secret_access_key
    commands:
      - 'bash ops/ci/woodpecker-deploy.sh build'

  - name: deploy
    image: bash
    when:
      - event: push
        branch: main
      - event: manual
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: deploy_aws_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: deploy_aws_secret_access_key
    commands:
      - 'bash ops/ci/woodpecker-deploy.sh deploy'
